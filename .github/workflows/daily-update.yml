name: Daily Supreme Court Update

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      term_year:
        description: "SCOTUS term year e.g. 2024. Leave blank to auto-detect."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    name: Fetch and process new cases
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run daily update script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TERM_YEAR: ${{ github.event.inputs.term_year }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/update-cases.ts

      - name: Fetch opinion authors from slip opinions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-opinion-authors.ts

      - name: Recompute justice speaking stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/compute-justice-stats.ts

      - name: Materialize Opinions Data term stats (non-fatal)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/compute-opinion-term-stats.ts

      - name: Recompute counsel speaking stats
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/compute-lawyer-stats.ts

      - name: Fetch circuit splits from CourtListener
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-circuit-splits.ts

      - name: Fetch appellate impacts from CourtListener
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-appellate-impacts.ts

      - name: Fetch analysis articles from RSS feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-analysis-articles.ts

      - name: Match Spotify podcast episodes to argued cases
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: npx tsx scripts/fetch-spotify-episodes.ts

      - name: Sync Spotify episode matches to Supabase (non-fatal)
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backfill-spotify-episodes.ts

      # Writes court_actions only (not shown on the site). Kill switch: set
      # the repository variable COURT_ORDERS_OFF to 1.
      - name: Read the Court's order lists into court_actions (non-fatal)
        continue-on-error: true
        env:
          COURT_ORDERS_OFF: ${{ vars.COURT_ORDERS_OFF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          npx tsx scripts/read-order-lists.ts

      - name: Dual-write parity check (Supabase vs. data/*.json, non-fatal)
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/parity-check.ts

      - name: Commit new case data
        run: |
          git config user.name "Supreme Court Wiki Bot"
          git config user.email "bot@supreme-court-wiki.noreply"
          git add data/
          if git diff --cached --quiet; then
            echo "No new case data - nothing to commit."
          else
            CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "chore: daily case update - ${CHANGED} file(s) [skip ci]"
            git push
            echo "Pushed ${CHANGED} updated file(s)."
          fi

      # Last step, after the commit: steps keep going when an SD database
      # write fails (scripts/lib/sd-db/failures.ts), but the run must not
      # show as a success.
      - name: Fail the run if any SD database write failed
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/sd-write-failures.log" ]; then
            echo "::error::SD database write failures in this run:"
            cat "$RUNNER_TEMP/sd-write-failures.log"
            exit 1
          fi
          echo "No SD database write failures."
